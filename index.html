<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penilaian Lomba Cerdas Cermat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            screens: {
              '4k': '2560px',
            }
          }
        }
      }
    </script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            animation: fall linear infinite;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden overflow-y-auto bg-slate-950">
    <div id="root" class="min-h-screen w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const playSound = (type, volume = 1.0) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'tick') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(900, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(volume * 0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'warning') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(650, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(volume * 0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'timeout') {
                oscillator.type = 'square';
                const duration = 3.5;
                for (let i = 0; i < duration; i += 0.5) {
                    oscillator.frequency.setValueAtTime(500, audioCtx.currentTime + i);
                    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime + i + 0.25);
                }
                gainNode.gain.setValueAtTime(volume * 0.8, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(volume * 0.8, audioCtx.currentTime + duration - 0.5);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + duration);
            } else if (type === 'click') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(volume * 0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            }
        };

        const Icon = ({ name, className = "w-4 h-4" }) => {
            const icons = {
                trophy: <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/>,
                play: <polygon points="5 3 19 12 5 21 5 3"/>,
                pause: <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>,
                reset: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/>,
                plus: <path d="M12 5v14M5 12h14"/>,
                minus: <path d="M5 12h14"/>,
                undo: <path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>,
                check: <polyline points="20 6 9 17 4 12"/>,
                cross: <path d="M18 6 6 18M6 6l12 12"/>,
                users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>,
                clock: <><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></>,
                volume: <><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></>,
                printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                maximize: <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>,
                minimize: <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>,
                settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
                home: <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
                history: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/><path d="M12 7v5l3 3"/></>,
                warning: <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3zM12 9v4M12 17h.01"/>,
                hash: <><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></>
            };
            return (
                <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name] || null}
                </svg>
            );
        };

        const TEAM_COLORS = [
            'bg-blue-600', 'bg-red-600', 'bg-green-600', 'bg-amber-500', 
            'bg-purple-600', 'bg-pink-600', 'bg-indigo-600', 'bg-teal-600'
        ];

        const DEFAULT_SETUP = {
            eventName: "LOMBA CERDAS CERMAT",
            date: new Date().toISOString().split('T')[0],
            totalQuestions: 10,
            autoNextQuestion: true,
            teamCount: 3,
            teams: [
                { id: 't1', name: "Tim 1", color: TEAM_COLORS[0], score: 0 },
                { id: 't2', name: "Tim 2", color: TEAM_COLORS[1], score: 0 },
                { id: 't3', name: "Tim 3", color: TEAM_COLORS[2], score: 0 },
            ],
            timer: { duration: 30, warningAt: 5, soundEnabled: true, tickSound: true },
            points: { correct: 100, wrong: 0, penalty: -50 },
        };

        const DEFAULT_MATCH = {
            currentQuestion: 1,
            history: [],
            undoneHistory: [],
            isFinished: false
        };

        function App() {
            const [activeView, setActiveView] = useState('setup');
            const [setup, setSetup] = useState(DEFAULT_SETUP);
            const [match, setMatch] = useState(DEFAULT_MATCH);
            const [timer, setTimer] = useState({ timeLeft: 30, isRunning: false, isTimeUp: false });
            
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
            const [manualInputs, setManualInputs] = useState({});

            const containerRef = useRef(null);

            useEffect(() => {
                const savedSetup = localStorage.getItem('lcc_setup');
                const savedMatch = localStorage.getItem('lcc_match');
                if (savedSetup && savedMatch) {
                    try {
                        setSetup(JSON.parse(savedSetup));
                        setMatch(JSON.parse(savedMatch));
                    } catch (e) {
                        console.error("Gagal membaca memori lokal:", e);
                    }
                }
            }, []);

            useEffect(() => {
                if (activeView !== 'setup') {
                    localStorage.setItem('lcc_setup', JSON.stringify(setup));
                    localStorage.setItem('lcc_match', JSON.stringify(match));
                }
            }, [setup, match, activeView]);

            useEffect(() => {
                let interval = null;
                if (timer.isRunning && timer.timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimer(prev => {
                            const newTime = prev.timeLeft - 1;
                            
                            if (setup.timer.soundEnabled) {
                                if (setup.timer.tickSound && newTime > 0) {
                                    playSound('tick');
                                }
                            }
                            
                            if (newTime === setup.timer.warningAt && setup.timer.soundEnabled) {
                                playSound('warning');
                            }
                            
                            if (newTime === 0) {
                                if (setup.timer.soundEnabled) playSound('timeout');
                                return { timeLeft: 0, isRunning: false, isTimeUp: true };
                            }
                            
                            return { ...prev, timeLeft: newTime };
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timer.isRunning, timer.timeLeft, setup.timer]);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    if (containerRef.current.requestFullscreen) {
                        containerRef.current.requestFullscreen().catch(err => console.error(err));
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            };

            useEffect(() => {
                const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                    if (activeView === 'dashboard') {
                        if (e.code === 'Space') {
                            e.preventDefault();
                            handleTimerToggle();
                        } else if (e.code === 'KeyR') {
                            handleTimerReset();
                        } else if (e.code === 'Escape') {
                            setTimer(prev => ({ ...prev, isRunning: false }));
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [activeView, timer, setup.teams]);

            const handleTimerToggle = () => {
                if (timer.isTimeUp) {
                   setTimer({ timeLeft: setup.timer.duration, isRunning: true, isTimeUp: false });
                } else {
                   setTimer(prev => ({ ...prev, isRunning: !prev.isRunning }));
                }
            };

            const handleTimerReset = () => {
                setTimer({ timeLeft: setup.timer.duration, isRunning: false, isTimeUp: false });
            };

            const updateScore = (teamId, changeAmount, note = '') => {
                const team = setup.teams.find(t => t.id === teamId);
                if (!team) return;

                const oldScore = team.score;
                const newScore = oldScore + changeAmount;
                
                if (setup.timer.soundEnabled) playSound('click');

                setSetup(prev => ({
                    ...prev,
                    teams: prev.teams.map(t => t.id === teamId ? { ...t, score: newScore } : t)
                }));

                setMatch(prev => {
                    let nextQ = prev.currentQuestion;
                    if (setup.autoNextQuestion && changeAmount > 0) {
                        nextQ = Math.min(prev.currentQuestion + 1, setup.totalQuestions);
                    }

                    return {
                        ...prev,
                        currentQuestion: nextQ,
                        history: [{
                            id: Date.now().toString(),
                            timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                            teamId: teamId,
                            teamName: team.name,
                            change: changeAmount,
                            oldScore,
                            newScore,
                            oldQuestion: prev.currentQuestion,
                            note: note || `Update Skor`,
                            question: prev.currentQuestion
                        }, ...prev.history].slice(0, 50),
                        undoneHistory: []
                    };
                });
            };

            const handleManualPointSubmit = (e, teamId) => {
                e.preventDefault();
                const inputVal = manualInputs[teamId];
                if (!teamId || !inputVal) return;
                const amount = parseInt(inputVal);
                if (!isNaN(amount)) {
                    updateScore(teamId, amount, 'Input Manual');
                    setManualInputs(prev => ({...prev, [teamId]: ""}));
                }
            };

            const undoLastAction = () => {
                if (match.history.length === 0) return;
                
                const lastAction = match.history[0];
                
                setSetup(prev => ({
                    ...prev,
                    teams: prev.teams.map(t => t.id === lastAction.teamId ? { ...t, score: lastAction.oldScore } : t)
                }));

                setMatch(prev => ({
                    ...prev,
                    currentQuestion: lastAction.oldQuestion || prev.currentQuestion,
                    history: prev.history.slice(1),
                    undoneHistory: [lastAction, ...prev.undoneHistory]
                }));
            };

            const resetAllScores = () => {
                setModal({
                    isOpen: true,
                    title: 'Reset Semua Skor?',
                    message: 'Apakah Anda yakin ingin mengatur ulang seluruh skor tim menjadi 0?',
                    confirmText: 'Ya, Reset Skor',
                    cancelText: 'Batal',
                    isDanger: true,
                    onConfirm: () => {
                        setSetup(prev => ({
                            ...prev,
                            teams: prev.teams.map(t => ({ ...t, score: 0 }))
                        }));
                        setMatch(prev => ({ ...prev, history: [], undoneHistory: [] }));
                        setModal({ isOpen: false });
                    }
                });
            };

            const startMatch = () => {
                setTimer({ timeLeft: setup.timer.duration, isRunning: false, isTimeUp: false });
                setMatch(prev => ({ ...prev, isFinished: false }));
                setActiveView('dashboard');
                if (audioCtx.state === 'suspended') audioCtx.resume();
            };

            const exportCSV = () => {
                const sortedTeams = [...setup.teams].sort((a, b) => b.score - a.score);
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += `Nama Lomba: ${setup.eventName}\n`;
                csvContent += `Tanggal: ${setup.date}\n\n`;
                csvContent += "Peringkat,Nama Tim,Skor Akhir\n";
                
                sortedTeams.forEach((team, index) => {
                    csvContent += `${index + 1},${team.name},${team.score}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Hasil_LCC_${setup.date}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const getTimerColor = () => {
                if (timer.isTimeUp) return 'text-red-500 animate-pulse drop-shadow-[0_0_20px_rgba(239,68,68,0.8)]';
                if (timer.timeLeft <= setup.timer.warningAt) return 'text-amber-400 drop-shadow-[0_0_20px_rgba(251,191,36,0.8)]';
                return 'text-cyan-400 drop-shadow-[0_0_20px_rgba(34,211,238,0.8)]';
            };

            const handleFinishMatch = () => {
                setModal({
                    isOpen: true,
                    title: 'Akhiri Pertandingan?',
                    message: 'Apakah Anda yakin ingin menyelesaikan lomba? Papan Juara Akhir akan langsung ditampilkan.',
                    confirmText: 'Selesai & Lihat Hasil',
                    cancelText: 'Batal',
                    isDanger: false,
                    onConfirm: () => {
                        setMatch(prev => ({ ...prev, isFinished: true }));
                        setActiveView('scoreboard');
                        setModal({ isOpen: false });
                    }
                });
            };

            const renderSetupView = () => (
                <div className="min-h-full w-full p-4 md:p-6 flex flex-col justify-between max-w-7xl mx-auto bg-slate-900/90 backdrop-blur-md rounded-3xl shadow-2xl relative overflow-y-auto border border-white/10">
                    <div className="text-center mb-2 flex-shrink-0 relative z-10">
                        <div className="inline-flex items-center justify-center p-2 bg-blue-500/10 text-blue-400 rounded-full mb-1">
                            <Icon name="trophy" className="w-8 h-8" />
                        </div>
                        <h1 className="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-cyan-400 tracking-tight uppercase">
                            SISTEM PENILAIAN LOMBA CERDAS CERMAT
                        </h1>
                        <p className="text-xs md:text-sm font-bold text-cyan-400 tracking-widest uppercase mt-0.5">
                            Developed by ARMANSYAH
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 min-h-0 overflow-hidden relative z-10">
                        <div className="space-y-3 flex flex-col overflow-hidden">
                            <section className="bg-slate-800/80 p-3.5 rounded-2xl border border-white/10 shadow-sm flex-shrink-0">
                                <h2 className="text-xs md:text-sm font-bold text-slate-200 flex items-center mb-2 uppercase tracking-wide">
                                    <Icon name="settings" className="w-4 h-4 mr-2 text-blue-400"/> Informasi Lomba & Soal
                                </h2>
                                <div className="space-y-2.5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">Nama Acara / Lomba</label>
                                        <input type="text" value={setup.eventName} onChange={e => setSetup({...setup, eventName: e.target.value})} className="w-full p-2 bg-slate-900/80 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-xs md:text-sm" placeholder="Contoh: LCC Ceria 2026" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2.5">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-1">Total Soal</label>
                                            <input type="number" value={setup.totalQuestions || 10} onChange={e => setSetup({...setup, totalQuestions: parseInt(e.target.value) || 1})} className="w-full p-2 bg-slate-900/80 border border-slate-700 rounded-xl text-white font-bold text-xs md:text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                                        </div>
                                        <div className="flex flex-col justify-end">
                                            <div className="flex items-center justify-between p-2 bg-slate-900/50 rounded-xl border border-slate-800 h-[38px]">
                                                <span className="text-[11px] font-semibold text-slate-300">Auto Next Soal</span>
                                                <input type="checkbox" checked={setup.autoNextQuestion !== false} onChange={e => setSetup({...setup, autoNextQuestion: e.target.checked})} className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <section className="bg-slate-800/80 p-3.5 rounded-2xl border border-white/10 shadow-sm flex-1 min-h-0 flex flex-col">
                                <div className="flex justify-between items-center mb-2 flex-shrink-0">
                                    <h2 className="text-xs md:text-sm font-bold text-slate-200 flex items-center uppercase tracking-wide"><Icon name="users" className="w-4 h-4 mr-2 text-indigo-400"/> Daftar Tim ({setup.teams.length})</h2>
                                    <div className="flex items-center space-x-1.5 bg-slate-900/80 p-1 rounded-lg border border-slate-700">
                                        <button onClick={() => {
                                            if (setup.teams.length > 2) {
                                                setSetup({...setup, teams: setup.teams.slice(0, -1), teamCount: setup.teamCount - 1});
                                            }
                                        }} className="p-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300"><Icon name="minus" className="w-3 h-3"/></button>
                                        <span className="font-bold text-xs text-white px-2">{setup.teams.length}</span>
                                        <button onClick={() => {
                                            const newId = `t${Date.now()}`;
                                            const color = TEAM_COLORS[setup.teams.length % TEAM_COLORS.length];
                                            setSetup({...setup, teams: [...setup.teams, { id: newId, name: `Tim ${setup.teams.length + 1}`, color, score: 0 }], teamCount: setup.teamCount + 1});
                                        }} className="p-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300"><Icon name="plus" className="w-3 h-3"/></button>
                                    </div>
                                </div>
                                
                                <div className="space-y-2 flex-1 overflow-y-auto pr-1 custom-scrollbar min-h-0">
                                    {setup.teams.map((team, idx) => (
                                        <div key={team.id} className="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-white/5">
                                            <div className={`w-6 h-6 rounded-full ${team.color} flex-shrink-0 border border-white/20 flex items-center justify-center text-white text-[10px] font-bold`}>{idx+1}</div>
                                            <input type="text" value={team.name} onChange={e => {
                                                const newTeams = [...setup.teams];
                                                newTeams[idx].name = e.target.value;

                                    <div className="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Durasi (Detik)</label>
                                        <input type="number" value={setup.timer.duration} onChange={e => setSetup({...setup, timer: {...setup.timer, duration: parseInt(e.target.value)||0}})} className="w-full bg-slate-800 border border-slate-700 p-1 rounded text-center text-base font-mono font-bold text-emerald-400 outline-none" />
                                    </div>
                                    <div className="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Peringatan (Detik)</label>
                                        <input type="number" value={setup.timer.warningAt} onChange={e => setSetup({...setup, timer: {...setup.timer, warningAt: parseInt(e.target.value)||0}})} className="w-full bg-slate-800 border border-slate-700 p-1 rounded text-center text-base font-mono font-bold text-amber-400 outline-none" />
                                    </div>
                                </div>
                                
                                <div className="space-y-2">
                                    <div className="flex items-center justify-between p-2 bg-slate-900/60 rounded-xl border border-slate-800">

                                        <input type="checkbox" checked={setup.timer.soundEnabled} onChange={e => setSetup({...setup, timer: {...setup.timer, soundEnabled: e.target.checked}})} className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700" />
                                    </div>
                                    <div className="flex items-center justify-between p-2 bg-slate-900/60 rounded-xl border border-slate-800">
                                        <span className="text-xs font-semibold text-slate-300">Suara Detik Berjalan</span>
                                        <input type="checkbox" checked={setup.timer.tickSound !== false} onChange={e => setSetup({...setup, timer: {...setup.timer, tickSound: e.target.checked}})} className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700" />
                                    </div>
                                </div>
                                <div className="mt-2 text-right">
                                    <button onClick={() => playSound('tick')} className="text-[11px] font-bold text-emerald-400 hover:text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg inline-flex items-center transition-colors"><Icon name="play" className="w-3 h-3 mr-1"/> Tes Suara Detik</button>
                                </div>
                            </section>

                            <section className="bg-slate-800/80 p-3.5 rounded-2xl border border-white/10 shadow-sm flex-shrink-0">
                                <h2 className="text-xs md:text-sm font-bold text-slate-200 flex items-center mb-2 uppercase tracking-wide"><Icon name="hash" className="w-4 h-4 mr-2 text-amber-400"/> Pengaturan 3 Nilai Poin</h2>
                                <div className="grid grid-cols-3 gap-2">
                                    <div className="bg-green-500/10 p-2 rounded-xl border border-green-500/20 text-center">
                                        <label className="block text-[10px] text-green-400 font-extrabold uppercase mb-1">Benar</label>
                                        <input type="number" value={setup.points.correct} onChange={e => setSetup({...setup, points: {...setup.points, correct: parseInt(e.target.value)||0}})} className="w-full bg-slate-900 border border-green-500/30 p-1 rounded font-bold text-center text-green-400 text-sm outline-none" />
                                    </div>
                                    <div className="bg-slate-500/10 p-2 rounded-xl border border-slate-500/20 text-center">
                                        <label className="block text-[10px] text-slate-400 font-extrabold uppercase mb-1">Salah</label>
                                        <input type="number" value={setup.points.wrong} onChange={e => setSetup({...setup, points: {...setup.points, wrong: parseInt(e.target.value)||0}})} className="w-full bg-slate-900 border border-slate-500/30 p-1 rounded font-bold text-center text-slate-300 text-sm outline-none" />
                                    </div>
                                    <div className="bg-red-500/10 p-2 rounded-xl border border-red-500/20 text-center">
                                        <label className="block text-[10px] text-red-400 font-extrabold uppercase mb-1">Penalti</label>
                                        <input type="number" value={setup.points.penalty} onChange={e => setSetup({...setup, points: {...setup.points, penalty: parseInt(e.target.value)||0}})} className="w-full bg-slate-900 border border-red-500/30 p-1 rounded font-bold text-center text-red-400 text-sm outline-none" />
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>

                    <div className="mt-3 pt-2 border-t border-white/10 flex justify-center relative z-10 flex-shrink-0">
                        <button onClick={startMatch} className="bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white px-10 py-3 rounded-2xl font-black text-base md:text-xl flex items-center shadow-[0_0_25px_rgba(37,99,235,0.4)] transition-all hover:scale-105 active:scale-95">
                            MULAI PERTANDINGAN <Icon name="play" className="ml-2.5 w-6 h-6"/>
                        </button>
                    </div>
                </div>
            );

            const renderDashboardView = () => (
                <div className="flex flex-col min-h-screen w-full bg-slate-950 text-slate-100 overflow-y-auto relative">
                    <header className="bg-slate-900/90 backdrop-blur-md border-b border-white/10 p-2 md:p-3 flex justify-between items-center shadow-lg z-10 flex-shrink-0">
                        <div className="flex items-center space-x-3">
                            <button onClick={() => {
                                setModal({
                                    isOpen: true,
                                    title: 'Ke Pengaturan?',
                                    message: 'Kembali ke pengaturan awal? Data pertandingan akan tetap tersimpan.',
                                    confirmText: 'Pengaturan',
                                    cancelText: 'Batal',
                                    onConfirm: () => { setActiveView('setup'); setModal({ isOpen: false }); }
                                });
                            }} className="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl border border-white/10 transition-colors flex items-center text-xs font-bold">
                                <Icon name="home" className="w-4 h-4 md:mr-1.5"/> <span className="hidden md:inline">Pengaturan</span>
                            </button>
                            <div className="hidden sm:block h-5 w-px bg-slate-800"></div>
                            <div className="flex flex-col">
                                <h1 className="font-black text-sm md:text-lg uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 tracking-wide">{setup.eventName}</h1>
                                <p className="text-[10px] font-bold text-cyan-400 uppercase tracking-widest">Developed by ARMANSYAH</p>
                            </div>
                            <div className="hidden sm:block h-6 w-px bg-slate-800 mx-1"></div>
                            <div className="flex items-center space-x-1.5 bg-slate-900 rounded-lg px-2.5 py-1 border border-white/10">
                                <span className="text-xs text-slate-400 font-semibold hidden sm:inline">Soal:</span>
                                <button onClick={() => setMatch(prev => ({...prev, currentQuestion: Math.max(1, prev.currentQuestion - 1)}))} className="p-0.5 hover:bg-slate-800 text-slate-300 rounded"><Icon name="minus" className="w-3 h-3"/></button>
                                <span className="font-mono font-black text-sm text-yellow-400">{match.currentQuestion} / {setup.totalQuestions}</span>
                                <button onClick={() => setMatch(prev => ({...prev, currentQuestion: Math.min(setup.totalQuestions, prev.currentQuestion + 1)}))} className="p-0.5 hover:bg-slate-800 text-slate-300 rounded"><Icon name="plus" className="w-3 h-3"/></button>
                            </div>
                        </div>

                        <div className="flex space-x-2">
                            <button onClick={handleFinishMatch} className="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 text-white px-3.5 py-1.5 rounded-xl font-black flex items-center text-xs transition-all shadow-[0_0_15px_rgba(225,29,72,0.4)] active:scale-95 border border-red-400/30">
                                <Icon name="check" className="w-4 h-4 mr-1"/> <span className="hidden sm:inline">SELESAI</span>
                            </button>
                            <button onClick={() => setActiveView('scoreboard')} className="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 text-slate-950 px-3.5 py-1.5 rounded-xl font-black flex items-center text-xs transition-all shadow-[0_0_15px_rgba(245,158,11,0.3)] active:scale-95">
                                <Icon name="trophy" className="w-4 h-4 mr-1"/> <span className="hidden sm:inline">SKOR</span>
                            </button>
                            <button onClick={toggleFullscreen} className="p-2 bg-slate-800 hover:bg-slate-700 border border-white/10 rounded-xl text-slate-300">
                                {isFullscreen ? <Icon name="minimize" className="w-4 h-4"/> : <Icon name="maximize" className="w-4 h-4"/>}
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden relative z-10">
                        <div className="flex-1 p-3 md:p-4 flex flex-col items-center justify-start border-r border-white/10 overflow-hidden">
                            
                            <div className="bg-slate-900/80 backdrop-blur-md rounded-2xl border border-white/10 shadow-2xl w-full max-w-5xl p-3 md:p-4 flex flex-col items-center justify-center relative flex-shrink-0 mb-3">
                                {timer.isTimeUp && <div className="absolute inset-0 bg-red-500/20 animate-pulse pointer-events-none rounded-2xl"></div>}
                                
                                <div className="absolute top-3 left-4 text-slate-400 font-bold uppercase tracking-widest text-[10px] md:text-xs flex items-center">
                                    <Icon name="clock" className="w-4 h-4 mr-1.5 text-blue-400"/> Timer Utama
                                </div>

                                <div className="absolute top-3 right-4 flex items-center space-x-1.5 bg-slate-950 px-2 py-1 rounded-lg border border-white/10">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase hidden sm:inline">Set:</span>
                                    <input 
                                        type="number" 
                                        value={setup.timer.duration}
                                        onChange={(e) => {
                                            const newDuration = parseInt(e.target.value) || 0;
                                            setSetup(prev => ({...prev, timer: {...prev.timer, duration: newDuration}}));
                                            if (!timer.isRunning) {
                                                setTimer(prev => ({...prev, timeLeft: newDuration, isTimeUp: false}));
                                            }
                                        }}
                                        className="w-12 p-0.5 text-center bg-slate-900 border border-slate-700 rounded text-xs font-bold text-white outline-none focus:border-blue-500"
                                    />
                                    <span className="text-[10px] font-bold text-slate-500">s</span>
                                </div>
                                
                                <div className={`font-mono text-[9vh] md:text-[12vh] leading-none font-black tracking-tighter ${getTimerColor()} transition-colors duration-300 py-1`}>
                                    {timer.isTimeUp ? "WAKTU HABIS!" : formatTime(timer.timeLeft)}
                                </div>

                                <div className="flex space-x-3 mt-2 w-full max-w-md justify-center">
                                    <button onClick={handleTimerToggle} className={`flex-1 py-2.5 rounded-xl font-black text-base md:text-lg flex justify-center items-center shadow-lg transition-all active:scale-95 border-b-4 ${timer.isRunning ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 border-amber-700' : timer.isTimeUp ? 'bg-slate-800 text-slate-600 border-slate-900 cursor-not-allowed' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 border-emerald-700'}`} disabled={timer.isTimeUp}>
                                        {timer.isRunning ? <><Icon name="pause" className="mr-2 w-5 h-5"/> PAUSE</> : <><Icon name="play" className="mr-2 w-5 h-5"/> START</>}
                                    </button>
                                    <button onClick={handleTimerReset} className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white border-b-4 border-slate-900 rounded-xl font-bold text-sm md:text-base flex items-center shadow-lg transition-all active:scale-95">
                                        <Icon name="reset" className="mr-2 w-4 h-4"/> RESET
                                    </button>
                                </div>
                            </div>

                            <div className="w-full max-w-7xl flex-1 flex flex-col justify-center min-h-0 overflow-hidden">
                                <div className={`grid grid-cols-1 sm:grid-cols-2 ${setup.teams.length >= 3 ? 'lg:grid-cols-3' : ''} gap-3 md:gap-4 w-full h-full min-h-0 overflow-y-auto pr-1 custom-scrollbar`}>
                                    {setup.teams.map(team => (
                                        <div key={team.id} className="bg-slate-900/90 rounded-2xl shadow-xl p-3 md:p-4 border border-white/10 flex flex-col h-full relative overflow-hidden justify-between">
                                            <div className={`absolute top-0 left-0 right-0 h-1.5 ${team.color}`}></div>

                                            <div className="text-center mb-2 flex justify-between items-center mt-1">
                                                <div className="text-left w-1/2 pr-2">
                                                    <h2 className="text-base md:text-xl font-black text-white truncate" title={team.name}>{team.name}</h2>
                                                </div>
                                                <div className="text-4xl md:text-6xl font-mono font-black text-yellow-400 drop-shadow-[0_0_12px_rgba(250,204,21,0.4)] truncate w-1/2 text-right">{team.score}</div>
                                            </div>

                                            <div className="grid grid-cols-3 gap-1.5 mb-2 flex-1 min-h-0">
                                                <button onClick={() => updateScore(team.id, setup.points.correct, 'Jawaban Benar')} className="bg-green-500/20 hover:bg-green-500/30 text-green-400 border border-green-500/30 rounded-xl font-bold text-xs md:text-base flex flex-col justify-center items-center active:scale-95 transition-all p-2">
                                                    <span>+{setup.points.correct}</span>
                                                    <span className="text-[9px] font-semibold uppercase opacity-75">Benar</span>
                                                </button>
                                                <button onClick={() => updateScore(team.id, setup.points.wrong, 'Jawaban Salah')} className="bg-slate-500/20 hover:bg-slate-500/30 text-slate-300 border border-slate-500/30 rounded-xl font-bold text-xs md:text-base flex flex-col justify-center items-center active:scale-95 transition-all p-2">
                                                    <span>{setup.points.wrong}</span>
                                                    <span className="text-[9px] font-semibold uppercase opacity-75">Salah</span>
                                                </button>
                                                <button onClick={() => updateScore(team.id, setup.points.penalty, 'Penalti')} className="bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 rounded-xl font-bold text-xs md:text-base flex flex-col justify-center items-center active:scale-95 transition-all p-2">
                                                    <span>{setup.points.penalty}</span>
                                                    <span className="text-[9px] font-semibold uppercase opacity-75">Penalti</span>
                                                </button>
                                            </div>

                                            <div className="pt-2 border-t border-white/10 flex items-center">
                                                <form onSubmit={(e) => handleManualPointSubmit(e, team.id)} className="flex w-full h-8 bg-slate-950 rounded-lg p-1 border border-white/10 focus-within:border-blue-500">
                                                    <input 
                                                        type="number" 
                                                        value={manualInputs[team.id] || ''} 
                                                        onChange={e => setManualInputs({...manualInputs, [team.id]: e.target.value})}
                                                        placeholder="Input Manual"
                                                        className="flex-1 px-2 bg-transparent text-white font-mono text-xs text-center outline-none placeholder:text-slate-600"
                                                    />
                                                    <button type="submit" className="bg-slate-800 hover:bg-slate-700 text-white px-3 rounded font-bold transition-colors text-xs">
                                                        OK
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="w-full md:w-64 lg:w-72 bg-slate-900/90 backdrop-blur-md border-l border-white/10 flex flex-col z-20 flex-shrink-0 h-full overflow-hidden">
                            <div className="p-3 border-b border-white/10 bg-slate-950/50">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-bold text-white text-xs flex items-center tracking-wide"><Icon name="trophy" className="w-4 h-4 mr-1 text-yellow-400"/> STANDINGS</h3>
                                    <button onClick={resetAllScores} className="text-[10px] font-bold text-red-400 hover:text-white bg-red-500/10 px-2 py-0.5 rounded border border-red-500/20"><Icon name="reset" className="w-2.5 h-2.5 inline mr-1"/> Reset</button>
                                </div>
                                <div className="space-y-1.5">
                                    {[...setup.teams].sort((a,b) => b.score - a.score).map((team, idx) => (
                                        <div key={team.id} className="flex justify-between items-center p-2 bg-slate-800/80 rounded-lg border border-white/5">
                                            <div className="flex items-center">
                                                <span className="w-4 text-center text-xs font-black text-slate-500">{idx+1}.</span>
                                                <div className={`w-2.5 h-2.5 rounded-full ${team.color} mx-1.5`}></div>
                                                <span className="font-bold text-xs text-slate-200 truncate max-w-[90px]">{team.name}</span>
                                            </div>
                                            <span className="font-mono font-black text-sm text-yellow-400">{team.score}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex-1 overflow-hidden flex flex-col">
                                <div className="p-2.5 border-b border-white/10 flex justify-between items-center bg-slate-950/30">
                                    <h3 className="font-bold text-slate-400 text-xs flex items-center uppercase tracking-wider"><Icon name="history" className="w-3.5 h-3.5 mr-1.5"/> Riwayat</h3>
                                    <button onClick={undoLastAction} disabled={match.history.length === 0} className={`text-[10px] px-2 py-1 rounded flex items-center font-bold ${match.history.length > 0 ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-slate-950 text-slate-600 cursor-not-allowed'}`}>
                                        <Icon name="undo" className="w-3 h-3 mr-1"/> Undo
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2 space-y-1.5 custom-scrollbar min-h-0">
                                    {match.history.length === 0 ? (
                                        <div className="text-center text-xs text-slate-600 mt-6">Belum ada aktivitas</div>
                                    ) : (
                                        match.history.map((log) => (
                                            <div key={log.id} className="bg-slate-800/60 p-2 rounded-lg border border-white/5 text-xs relative overflow-hidden">
                                                <div className={`absolute left-0 top-0 bottom-0 w-1 ${log.change > 0 ? 'bg-green-500' : log.change < 0 ? 'bg-red-500' : 'bg-slate-500'}`}></div>
                                                <div className="flex justify-between items-start mb-1">
                                                    <span className="font-bold text-white truncate pr-1">{log.teamName}</span>
                                                    <span className="text-[9px] text-slate-500 font-mono">{log.timestamp}</span>
                                                </div>
                                                <div className="flex justify-between items-end">
                                                    <span className="text-slate-400 text-[10px]">{log.note}</span>
                                                    <span className={`font-mono font-black text-xs ${log.change > 0 ? 'text-green-400' : log.change < 0 ? 'text-red-400' : 'text-slate-400'}`}>
                                                        {log.change > 0 ? '+' : ''}{log.change}
                                                    </span>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderScoreboardView = () => {
                const sortedTeams = [...setup.teams].sort((a, b) => b.score - a.score);
                
                return (
                    <div className="min-h-screen w-full bg-slate-950 text-white p-4 md:p-6 flex flex-col justify-between relative overflow-y-auto">
                        {match.isFinished && (
                            <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
                                {[...Array(60)].map((_, i) => (
                                    <div key={i} className="absolute w-3 h-3 rounded-sm confetti-piece"
                                         style={{
                                             left: `${Math.random() * 100}vw`,
                                             top: `-5vh`,
                                             backgroundColor: ['#facc15', '#3b82f6', '#ef4444', '#10b981', '#a855f7'][Math.floor(Math.random() * 5)],
                                             animationDelay: `${Math.random() * 3}s`,
                                             animationDuration: `${2 + Math.random() * 4}s`
                                         }}>
                                    </div>
                                ))}
                            </div>
                        )}

                        <header className="flex justify-between items-center mb-4 relative z-10 flex-shrink-0">
                            <button onClick={() => setActiveView('dashboard')} className="text-slate-300 hover:text-white flex items-center font-bold px-4 py-2 bg-slate-900 border border-white/10 rounded-xl text-xs md:text-sm">
                                <Icon name="undo" className="w-4 h-4 mr-2"/> Kembali ke Dashboard
                            </button>
                            <div className="flex space-x-3">
                                <button onClick={() => window.print()} className="bg-slate-900 hover:bg-slate-800 border border-white/10 px-4 py-2 rounded-xl flex items-center font-bold text-slate-300 text-xs md:text-sm">
                                    <Icon name="printer" className="w-4 h-4 mr-2"/> Cetak
                                </button>
                                <button onClick={exportCSV} className="bg-gradient-to-r from-blue-600 to-cyan-600 px-4 py-2 rounded-xl flex items-center font-bold text-white text-xs md:text-sm shadow-lg">
                                    <Icon name="download" className="w-4 h-4 mr-2"/> Export CSV
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 flex flex-col items-center justify-center relative z-10 w-full max-w-6xl mx-auto min-h-0 overflow-hidden">
                            <div className="text-center mb-4 flex-shrink-0">
                                <h1 className="text-3xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 uppercase tracking-tight">
                                    {match.isFinished ? 'JUARA LOMBA' : 'PAPAN SKOR'}
                                </h1>
                                <h2 className="text-lg md:text-2xl text-slate-200 font-bold tracking-wide">{setup.eventName}</h2>
                                <p className="text-xs md:text-sm text-cyan-400 font-bold uppercase mt-0.5">Developed by ARMANSYAH</p>
                            </div>

                            <div className="w-full flex-1 min-h-0 overflow-y-auto pr-1 custom-scrollbar space-y-3 flex flex-col justify-center">
                                {sortedTeams.map((team, index) => {
                                    const isFirst = index === 0;
                                    const isSecond = index === 1;
                                    const isThird = index === 2;

                                    let cardStyle = "bg-slate-800/60 backdrop-blur-md border-slate-700/50";
                                    let rankStyle = "text-slate-500";
                                    let scoreStyle = "text-yellow-400";
                                    let glowEffect = "";

                                    if (isFirst) {
                                      cardStyle = "bg-gradient-to-r from-yellow-900/40 to-slate-800/80 backdrop-blur-md border-yellow-500/50";
                                      rankStyle = "text-yellow-400";
                                      scoreStyle = "text-yellow-300 drop-shadow-[0_0_15px_rgba(253,224,71,0.6)]";
                                      glowEffect = match.isFinished ? "shadow-[0_0_50px_rgba(234,179,8,0.3)] border-2" : "shadow-[0_0_30px_rgba(234,179,8,0.15)]";
                                    } else if (isSecond) {
                                      cardStyle = "bg-gradient-to-r from-slate-700/50 to-slate-800/80 backdrop-blur-md border-slate-400/30";
                                      rankStyle = "text-slate-300";
                                      scoreStyle = "text-slate-200 drop-shadow-[0_0_10px_rgba(203,213,225,0.4)]";
                                      glowEffect = "shadow-lg";
                                    } else if (isThird) {
                                      cardStyle = "bg-gradient-to-r from-amber-900/30 to-slate-800/80 backdrop-blur-md border-amber-700/30";
                                      rankStyle = "text-amber-500";
                                      scoreStyle = "text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.4)]";
                                      glowEffect = "shadow-lg";
                                    }

                                    return (
                                        <div key={team.id} className={`rounded-2xl p-3 md:p-4 flex items-center border transform transition-all duration-300 hover:scale-[1.01] print:bg-white print:border-slate-300 print:shadow-none print:text-black relative overflow-hidden flex-shrink-0 ${cardStyle} ${glowEffect}`}>
                                            <div className={`absolute left-0 top-0 bottom-0 w-2.5 ${team.color} print:w-2`}></div>
                                            
                                            <div className="w-12 md:w-20 flex-shrink-0 text-center pl-1">
                                                {isFirst ? <Icon name="trophy" className="w-7 h-7 md:w-10 md:h-10 mx-auto text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]"/> : 
                                                 isSecond ? <Icon name="trophy" className="w-6 h-6 md:w-8 md:h-8 mx-auto text-slate-300"/> :
                                                 isThird ? <Icon name="trophy" className="w-5 h-5 md:w-7 md:h-7 mx-auto text-amber-600"/> :
                                                 <span className={`text-lg md:text-2xl font-black ${rankStyle} print:text-slate-400`}>#{index + 1}</span>}
                                            </div>
                                            
                                            <div className="flex-1 px-3 md:px-5 border-l border-white/10 ml-2 print:border-slate-200 flex items-center min-w-0">
                                                <div className={`w-5 h-5 md:w-8 md:h-8 rounded-full ${team.color} mr-2.5 md:mr-3.5 shadow-md border-2 border-slate-900 print:border-white flex-shrink-0`}></div>
                                                <h3 className="text-base md:text-2xl lg:text-3xl font-black text-white truncate print:text-black tracking-tight">{team.name}</h3>
                                            </div>
                                            
                                            <div className="w-24 md:w-44 text-right pr-2">
                                                <div className={`text-2xl md:text-4xl lg:text-5xl font-mono font-black tracking-tighter ${scoreStyle} print:text-black`}>{team.score}</div>
                                                <div className="text-[9px] md:text-[10px] text-slate-400 uppercase tracking-widest mt-0.5 font-bold print:text-slate-500">Total Poin</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen w-full bg-slate-950 text-white font-sans overflow-y-auto" ref={containerRef}>
                    {activeView === 'setup' && renderSetupView()}
                    {activeView === 'dashboard' && renderDashboardView()}
                    {activeView === 'scoreboard' && renderScoreboardView()}

                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-900 border border-white/10 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
                                <div className={`p-4 ${modal.isDanger ? 'bg-red-500/20' : 'bg-blue-500/20'} border-b border-white/10 flex items-center`}>
                                    <Icon name="warning" className={`w-6 h-6 mr-3 ${modal.isDanger ? 'text-red-400' : 'text-blue-400'}`}/>
                                    <h3 className="text-lg font-bold text-white">{modal.title}</h3>
                                </div>
                                <div className="p-6 text-slate-300 text-center font-medium text-sm">
                                    {modal.message}
                                </div>
                                <div className="p-4 bg-slate-950 border-t border-white/10 flex justify-end space-x-3">
                                    <button onClick={modal.onCancel || (() => setModal({isOpen: false}))} className="px-4 py-2 rounded-xl font-semibold text-slate-400 hover:bg-slate-800 text-xs">
                                        {modal.cancelText || 'Batal'}
                                    </button>
                                    <button onClick={modal.onConfirm} className={`px-4 py-2 rounded-xl font-bold text-white text-xs ${modal.isDanger ? 'bg-red-600 hover:bg-red-500' : 'bg-blue-600 hover:bg-blue-500'}`}>
                                        {modal.confirmText || 'Konfirmasi'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
